<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tinkerbell Debug</title>
</head>

<body>
    <h1>Tinkerbell Debug Test</h1>

    <form id="test-form">
        <input type="text" name="businessName" placeholder="Business Name" value="Test Business" required>
        <textarea name="businessDescription" placeholder="Description" required>Test description for debugging</textarea>
        <button type="submit">Test Submit</button>
    </form>

    <div id="output"></div>

    <script>
        console.log('🧪 Debug page loaded');

        document.getElementById('test-form').addEventListener('submit', async(e) => {
            e.preventDefault();
            console.log('📋 Form submitted');

            const formData = new FormData(e.target);
            const data = {
                businessName: formData.get('businessName'),
                businessDescription: formData.get('businessDescription'),
                targetCustomers: 'Test customers',
                goals: 'Test goals'
            };

            console.log('📤 Data to send:', data);

            try {
                const response = await fetch('http://localhost:3000/api/create-personas', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data)
                });

                console.log('📡 Response status:', response.status);

                if (response.ok) {
                    const result = await response.json();
                    console.log('✅ Success:', result);
                    document.getElementById('output').innerHTML = '<h2>✅ Success!</h2><pre>' + JSON.stringify(result, null, 2) + '</pre>';
                } else {
                    const error = await response.text();
                    console.error('❌ Error:', error);
                    document.getElementById('output').innerHTML = '<h2>❌ Error!</h2><pre>' + error + '</pre>';
                }
            } catch (error) {
                console.error('❌ Network error:', error);
                document.getElementById('output').innerHTML = '<h2>❌ Network Error!</h2><pre>' + error.message + '</pre>';
            }
        });
    </script>
</body>

</html>
