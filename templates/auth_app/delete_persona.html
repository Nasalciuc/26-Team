{% extends 'base.html' %}

{% block title %}Șterge Persona - Team 26{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto p-6 animate-fade-in">
    <div class="robust-card rounded-2xl p-8 text-center">
        <div class="w-16 h-16 rounded-2xl bg-gradient-to-br from-red-500 to-red-600 flex items-center justify-center mx-auto mb-6 shadow-2xl border-4 border-red-400/50">
            <i class="bi bi-trash text-white text-3xl"></i>
        </div>
        <h1 class="text-2xl font-black text-red-400 mb-4">Ești sigur că vrei să ștergi această persoană?</h1>
        <p class="text-gray-400 mb-6">{{ persona.name }}<br><span class="text-xs">{{ persona.age }} ani, {{ persona.location }}</span></p>
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="bg-red-900 border-2 border-red-400 text-red-400 py-3 px-8 rounded-lg text-lg font-bold flex items-center justify-center hover:bg-red-400 hover:text-black transition-all duration-300">
                <i class="bi bi-trash mr-2"></i> Confirmă Ștergerea
            </button>
            <a href="{% url 'auth_app:personas_list' %}" class="ml-4 robust-button py-3 px-8 rounded-lg text-lg font-bold">Renunță</a>
        </form>
    </div>
</div>
{% endblock %}
