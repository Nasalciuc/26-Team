{% extends 'base.html' %}

{% block title %}Analiză Site - Team 26{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto px-6 py-24 animate-fade-in">
    <div class="text-center mb-12">
        <i class="bi bi-search-heart text-6xl text-gradient"></i>
        <h1 class="text-4xl lg:text-5xl font-bold text-gradient mt-4">Analiză Rapidă Site</h1>
        <p class="text-lg text-yellow-400/70 mt-2">Introdu adresa URL a site-ului pe care vrei să-l analizezi.</p>
    </div>

    <div class="robust-card p-8">
        <form method="post" action="{% url 'auth_app:scraping' %}" class="space-y-6">
            {% csrf_token %}
            <div>
                <label for="url" class="block text-sm font-bold text-yellow-400 mb-2">Adresa URL a site-ului</label>
                <div class="relative">
                    <i class="bi bi-link-45deg absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
                    <input 
                        type="url"
                        name="url"
                        id="url"
                        class="w-full pl-12 pr-4 py-4 bg-black border-2 border-gray-700 rounded-lg text-yellow-400 placeholder-gray-500 focus:border-yellow-400 focus:ring-2 focus:ring-yellow-400/20 transition-all duration-300 font-medium input-yellow-focus"
                        placeholder="https://exemplu.ro"
                        required
                    >
                </div>
            </div>
            
            <div class="pt-4">
                <button 
                    type="submit" 
                    class="w-full robust-button py-4 px-6 rounded-lg text-lg font-bold uppercase tracking-wider transition-all duration-300 hover:scale-105"
                >
                    <i class="bi bi-arrow-right-circle mr-3"></i>
                    Pornește Analiza
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
